name: Build Unity AAR

on:
  push:
    branches:
      - unity-support
    tags:
      - 'unity-v*'
    paths:
      - 'unity/**'
      - 'haishinkit/**'
      - 'rtmp/**'
      - '.github/workflows/build-unity-aar.yml'
  pull_request:
    branches:
      - unity-support
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        type: boolean
        default: true
      version:
        description: 'Release version (e.g., unity-v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Unity module
        run: ./gradlew :unity:assembleRelease

      - name: Build HaishinKit module
        run: ./gradlew :haishinkit:assembleRelease

      - name: Build RTMP module
        run: ./gradlew :rtmp:assembleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp unity/build/outputs/aar/unity-release.aar artifacts/HaishinKitUnity.aar
          cp haishinkit/build/outputs/aar/haishinkit-release.aar artifacts/haishinkit.aar
          cp rtmp/build/outputs/aar/rtmp-release.aar artifacts/rtmp.aar
          ls -la artifacts/

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unity-aars
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/unity-v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: unity-aars
          path: artifacts/

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            # Generate version from date and commit
            VERSION="unity-v$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Unity Support ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/HaishinKitUnity.aar
            artifacts/haishinkit.aar
            artifacts/rtmp.aar
          body: |
            ## HaishinKit.kt Unity Support

            AAR files for Unity integration.

            ### Files

            | File | Description |
            |------|-------------|
            | `HaishinKitUnity.aar` | Unity bridge module |
            | `haishinkit.aar` | Core HaishinKit library |
            | `rtmp.aar` | RTMP protocol support |

            ### Installation

            Copy all AAR files to your Unity project:
            ```
            Assets/Plugins/Android/
            ├── HaishinKitUnity.aar
            ├── haishinkit.aar
            └── rtmp.aar
            ```

            ### Commit
            ${{ github.sha }}
